<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatara</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <!-- Header -->
    <header class="popup-header">
      <span class="popup-logo-dot"></span>
      <span class="popup-title">Avatara</span>
      <button class="btn-icon" id="btnSettings" title="Settings" style="margin-left:auto;">⚙</button>
    </header>

    <!-- Daily Summary -->
    <section class="popup-section" id="dailySummary">
      <div class="skeleton" style="height:40px;"></div>
    </section>

    <!-- Quick Search -->
    <section class="popup-section">
      <input type="text" class="popup-search" id="quickSearch" placeholder="Search your history…">
    </section>

    <!-- Active Goal -->
    <section class="popup-section" id="goalCard" style="display:none;"></section>

    <!-- Quick Actions -->
    <section class="popup-actions">
      <button class="btn btn-primary btn-sm" id="btnOpenPanel">Open Side Panel</button>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="badge badge--accent" id="tierBadge">Free</span>
      <span class="text-muted">v0.1.0</span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
