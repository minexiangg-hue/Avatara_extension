<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatara</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__logo">
        <span class="app-header__logo-dot"></span>
        <span data-i18n="appName">Avatara</span>
      </div>
      <nav class="app-nav" id="mainNav">
        <button class="app-nav__btn active" data-view="chat" title="Chat" aria-label="Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="app-nav__btn" data-view="insights" title="Insights" aria-label="Insights">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </button>
        <button class="app-nav__btn" data-view="tabs" title="Tabs" aria-label="Tabs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </button>
        <button class="app-nav__btn" data-view="settings" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="app-main" id="mainContent">
      <section class="view active" id="view-chat">
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
              <div class="empty-state__icon">✦</div>
              <div class="empty-state__text" data-i18n="onboardingReady">All set! Try asking me something…</div>
              <div class="chat-suggestions" id="chatSuggestions"></div>
            </div>
          </div>
          <div class="chat-input-area">
            <textarea class="textarea" id="chatInput" placeholder="Ask me anything about your browsing…" rows="1" data-i18n-placeholder="chatPlaceholder"></textarea>
            <button class="btn btn-primary btn-icon" id="chatSend" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="view" id="view-insights">
        <div class="insights-container" id="insightsContainer">
          <div class="empty-state"><div class="empty-state__text" data-i18n="insightsNoData">Not enough data yet…</div></div>
        </div>
      </section>

      <section class="view" id="view-tabs">
        <div class="tabs-container" id="tabsContainer">
          <div class="empty-state"><div class="empty-state__text">Loading tabs…</div></div>
        </div>
      </section>

      <section class="view" id="view-settings">
        <div class="settings-container" id="settingsContainer"></div>
      </section>
    </main>

    <!-- Status Bar -->
    <footer class="app-statusbar">
      <div class="app-statusbar__left">
        <span class="badge badge--accent" id="tierBadge">Free</span>
        <span id="syncStatus"></span>
      </div>
      <div class="app-statusbar__right">
        <span id="pageCount">—</span>
      </div>
    </footer>
  </div>

  <!-- Components -->
  <script type="module" src="components/chat-message/chat-message.js"></script>
  <script type="module" src="components/insight-card/insight-card.js"></script>
  <script type="module" src="components/goal-progress/goal-progress.js"></script>

  <!-- App -->
  <script type="module" src="js/components/message-bus.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
